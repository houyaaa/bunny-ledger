<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="낙서 가계부">
<title>낙서 가계부</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 달력 홈 -->
<main id="home" class="screen">
  <header class="top">
    <div class="brand">
      <img src="img/bunny-face.png" alt="" class="brand-bunny">
      <h1 class="hand">낙서 가계부</h1>
    </div>
    <button id="openStats" class="pill pill-lav hand" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2a8.8 8.8 0 1 0 8.8 8.9H12z"/><path d="M14.6 3.4v6.2h6.1a7 7 0 0 0-6.1-6.2z"/></svg>
      통계
    </button>
  </header>

  <div class="month-nav">
    <button id="prevMonth" class="icon-btn" type="button" aria-label="이전 달">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5.5 8.5 12.2 15.4 18.5"/></svg>
    </button>
    <button id="monthLabel" class="month-label hand" type="button" aria-label="이번 달로 이동"></button>
    <button id="nextMonth" class="icon-btn" type="button" aria-label="다음 달">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5.4 15.6 12 8.7 18.6"/></svg>
    </button>
  </div>

  <section class="total-card sketch">
    <div class="muted small">이번 달 쓴 돈</div>
    <div class="total hand"><span id="monthTotal">0</span><span class="won">원</span></div>
    <div id="monthSub" class="muted tiny"></div>
    <img src="img/bunny-coin.png" alt="" class="coin-bunny">
  </section>

  <section class="calendar" aria-label="달력">
    <div class="weekdays hand" aria-hidden="true">
      <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
    </div>
    <div id="calGrid" class="cal-grid"></div>
  </section>

  <section class="today">
    <div class="today-head">
      <h2 id="todayTitle" class="hand"></h2>
      <span id="todayTotal" class="hand"></span>
    </div>
    <ul id="todayList" class="entry-list"></ul>
  </section>
</main>

<!-- 통계 -->
<section id="stats" class="screen" hidden>
  <header class="stats-top">
    <button id="closeStats" class="icon-btn" type="button" aria-label="달력으로 돌아가기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5.5 8.5 12.2 15.4 18.5"/></svg>
    </button>
    <h1 id="statsTitle" class="hand"></h1>
  </header>

  <div class="stats-total">
    <img src="img/bunny-paper.png" alt="" class="paper-bunny">
    <div>
      <div class="muted small">이번 달 총 지출</div>
      <div class="hand stats-sum"><span id="statsTotal">0</span><span class="won">원</span></div>
    </div>
  </div>

  <div class="chart-card sketch">
    <div id="pieWrap"></div>
    <div id="topText" class="hand top-text"></div>
  </div>

  <div class="compare">
    <button id="compareBtn" class="compare-btn sketch" type="button" aria-expanded="false" aria-controls="comparePanel">
      <span class="hand compare-title">지난달 대비</span>
      <span class="grow"><span id="diffChip" class="chip"></span></span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 9 12.2 15.4 18.5 8.8"/></svg>
    </button>
    <div id="comparePanel" class="compare-panel" hidden></div>
  </div>

  <div class="backup">
    <button id="exportBtn" class="link-btn" type="button">백업 파일 저장</button>
    <span aria-hidden="true">·</span>
    <label class="link-btn">백업 불러오기<input id="importInput" type="file" accept="application/json,.json" hidden></label>
  </div>
</section>

<!-- 기록 시트 -->
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet-box">
  <img src="img/bunny-lying.png" alt="" class="lying-bunny">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle" class="hand"></h2>
      <button class="icon-btn" type="button" aria-label="닫기" data-close>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5.5 5.2 18.6 18.4M18.3 5.6 5.4 18.7"/></svg>
      </button>
    </div>

    <ul id="sheetList" class="entry-list compact"></ul>

    <div class="amount-box sketch">
      <div class="amount-top">
        <label for="amountInput" class="muted small">얼마 썼어요?</label>
        <span id="selChip" class="chip"></span>
      </div>
      <div class="amount-row">
        <input id="amountInput" type="text" inputmode="numeric" autocomplete="off" placeholder="0" class="hand">
        <span class="hand won-lg">원</span>
      </div>
    </div>

    <div class="cats">
      <h3 class="hand">카테고리</h3>
      <div id="catGrid" class="cat-grid"></div>
      <p class="hint tiny muted">직접 만든 카테고리는 길게 누르면 지울 수 있어요.</p>
    </div>

    <div id="addForm" class="add-form" hidden>
      <label for="newCatName" class="muted small">새 카테고리 이름</label>
      <input id="newCatName" type="text" maxlength="5" placeholder="예: 반려동물">
      <div class="swatches">
        <span class="muted small">색</span>
        <div id="swatchRow" class="swatch-row"></div>
      </div>
      <div class="add-actions">
        <button id="cancelAdd" type="button" class="btn-ghost">취소</button>
        <button id="confirmAdd" type="button" class="btn-ink">추가하기</button>
      </div>
    </div>

    <button id="saveBtn" class="save hand" type="button">기록하기</button>
  </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
